<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Match Score - Satyarth Vaidya</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="theme-switch-wrapper">
      <label class="theme-switch" for="checkbox">
        <input type="checkbox" id="checkbox" />
        <div class="slider round"></div>
      </label>
      <em>Dark Mode</em>
    </div>
    <a
      href="index.html"
      class="back-btn"
      style="
        position: absolute;
        top: 20px;
        left: 20px;
        display: flex;
        align-items: center;
        gap: 6px;
        background: var(--background-secondary, #222);
        color: var(--primary-color, #fff);
        padding: 8px 14px;
        border-radius: 6px;
        text-decoration: none;
        font-weight: 500;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        z-index: 1000;
      "
    >
      <i class="fas fa-arrow-left"></i> Back
    </a>
    <header>
      <div class="header-content">
        <h1>Job Match Score</h1>
        <p class="subtitle">
          Welcome, recruiter! Paste your job description below and instantly see
          how well Satyarth's experience and skills match your role. Get a
          quick, AI-powered fit score and summary.
        </p>
      </div>
    </header>
    <main>
      <section class="job-match-section">
        <form id="job-match-form">
          <label for="job-description"
            >Job Description
            <span
              style="
                color: var(--secondary-color);
                font-weight: 400;
                font-size: 0.95em;
              "
              >(Paste the full text here)</span
            ></label
          >
          <textarea
            id="job-description"
            name="job-description"
            rows="10"
            placeholder="Paste your job description here..."
            required
          ></textarea>
          <button type="submit" class="calculate-btn">
            Calculate Match Score
          </button>
        </form>
        <div id="result-section" class="result-section" style="display: none">
          <div class="score-display">
            <span id="match-score"></span>
          </div>
          <div class="score-explanation">
            <p id="match-explanation"></p>
          </div>
          <button
            id="try-again-btn"
            class="try-again-btn"
            style="display: none"
          >
            Try another job
          </button>
        </div>
        <div
          id="loading-indicator"
          class="loading-indicator"
          style="display: none"
        >
          <span class="loading-spinner"></span>
          Analyzing your job description...
        </div>
      </section>
    </main>
    <footer>
      <p>© 2024 Satyarth Vaidya. All rights reserved.</p>
    </footer>
    <script src="jobMatch.js"></script>
  </body>
</html>
